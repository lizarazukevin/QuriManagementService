---
# Builds and tests QuriManagementService (Kotlin + Spring Boot + Gradle).
#
# QuriModels is consumed via a Gradle composite build (see settings.gradle.kts:
# includeBuild("../QuriModels")), not as a published Maven artifact. That means
# this workflow checks out both repos side by side so Gradle can substitute
# `com.quri:quri-models` with QuriModels' current source at build time — no
# publish step, no version pinning, always builds against latest QuriModels.
#
# Split into three sequential jobs so a failure clearly points to a stage:
#   1. static-analysis      — detekt
#   2. unit-tests            — ./gradlew test
#   3. integration-tests     — Testcontainers + real Mongo via Docker,
#                              followed by kover coverage gate (90%)
#
# Coverage verification (koverVerify) is intentionally kept in the same
# job as integration-tests rather than split out on its own. Kover needs
# execution data from both unit and integration tests to compute
# coverage — if koverVerify ran in a separate job on a fresh runner,
# Gradle would re-run those test tasks (including spinning up the
# Testcontainers Mongo instance again) just to regenerate that data.
# Keeping it in the same job means the container-backed integration
# suite only runs once per workflow run.
name: Gradle Build & Test

"on":
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QuriManagementService
        uses: actions/checkout@v7
        with:
          path: QuriManagementService

      - name: Checkout QuriModels
        uses: actions/checkout@v7
        with:
          repository: lizarazukevin/QuriModels
          path: QuriModels

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Detekt
        working-directory: QuriManagementService
        run: ./gradlew detekt --no-daemon

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: QuriManagementService/build/reports/detekt/
          retention-days: 14

  unit-tests:
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QuriManagementService
        uses: actions/checkout@v7
        with:
          path: QuriManagementService

      - name: Checkout QuriModels
        uses: actions/checkout@v7
        with:
          repository: lizarazukevin/QuriModels
          path: QuriModels

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        working-directory: QuriManagementService
        run: ./gradlew test --no-daemon

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: QuriManagementService/build/reports/tests/
          retention-days: 14

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QuriManagementService
        uses: actions/checkout@v7
        with:
          path: QuriManagementService

      - name: Checkout QuriModels
        uses: actions/checkout@v7
        with:
          repository: lizarazukevin/QuriModels
          path: QuriModels

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Integration tests
        working-directory: QuriManagementService
        run: ./gradlew integration --no-daemon

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-report
          path: QuriManagementService/build/reports/tests/
          retention-days: 14

      - name: Coverage verification
        working-directory: QuriManagementService
        run: ./gradlew koverVerify --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: QuriManagementService/build/reports/kover/
          retention-days: 14
